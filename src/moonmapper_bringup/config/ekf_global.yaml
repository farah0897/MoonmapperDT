# robot_localization — global EKF: lokal odometri + UWB-pose -> /odometry/global, TF map -> odom
# Startes med node-navn ekf_global og remap av odometry/filtered -> /odometry/global

ekf_global:
  ros__parameters:
    frequency: 20.0
    sensor_timeout: 0.5
    two_d_mode: true
    use_sim_time: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: map

    # Hastighet/twist fra lokalfilter (ikke posisjon her — UWB korrigerer drift i map).
    odom0: /odometry/local
    odom0_config: [false, false, false,
                   false, false, false,
                   true, false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false

    pose0: /uwb/pose
    pose0_config: [true, true, false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    pose0_differential: false
    pose0_relative: false
