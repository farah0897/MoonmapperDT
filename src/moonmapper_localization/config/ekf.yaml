# robot_localization EKF config for MoonMapper rover (sim)
# Fuses /odom and optionally /imu. Enable via use_ekf:=true in bringup.

ekf_filter_node:
  ros__parameters:
    frequency: 30
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Odom input
    odom0: /odom
    odom0_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false

    # Optional: IMU (uncomment when using /imu)
    # imu0: /imu/data
    # imu0_config: [false, false, false,
    #               false, false, false,
    #               false, false, false,
    #               false, false, true,
    #               true,  true,  true]
    # imu0_differential: true
    # imu0_relative: true
