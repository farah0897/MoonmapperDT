# Short mission for nav2_static_map_mission_test (odom localization, no 2D Pose Estimate).
nav2_mission_client_node:
  ros__parameters:
    use_sim_time: true
    frame_id: map
    mission_frame: map
    localization_mode: odom
    autostart: true
    loop: false
    start_delay_sec: 3.0
