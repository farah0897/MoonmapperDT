# V1 frontier explorer (moonmapper_nav2) — loaded by autonomous_exploration_full.launch.py
#
# Publishers /frontier_explorer/status (std_msgs/String) and /frontier_explorer/current_goal
# (geometry_msgs/PoseStamped) use TRANSIENT_LOCAL durability so DDS advertises types while the
# node is running; ros2 topic info shows them after the node has started spinning.
frontier_explorer:
  ros__parameters:
    use_sim_time: true
    map_topic: /map
    map_frame: map
    base_frame: base_footprint
    navigate_action: /navigate_to_pose
    cmd_vel_topic: /cmd_vel_raw
    exploration_rate_hz: 2.0
    min_frontier_cluster_size: 5
    # Safe goal distance band (avoid sub-1 m goals near obstacles)
    min_goal_distance: 0.5
    # 0.85 m min for 3x6 m sim arena; use 1.0+ on larger maps
    min_goal_distance_m: 0.5
    max_goal_distance: 6.0
    max_goal_distance_m: 6.0
    max_goal_distance_stage_m: 6.0
    goal_timeout_sec: 120.0
    occupied_threshold: 65
    free_threshold: 0
    unknown_value: -1
    unknown_as_blocked_in_planner_grid: true
    goal_inflation_radius_m: 0.15
    bfs_goal_inflation_radius_m: 0.10
    approach_search_radius_min_m: 0.2
    approach_search_radius_max_m: 2.0
    allow_frontier_adjacent_unknown: true
    require_strict_reachability_for_goal: false
    require_passable_for_approach: false
    frontier_neighbor_fallback_m: 1.0
    min_occupied_clearance_m: 0.15
    # Safe approach scoring (obstacle distance map)
    min_obstacle_clearance_m: 0.38
    min_obstacle_clearance_floor_m: 0.32
    preferred_obstacle_clearance_m: 0.65
    min_unknown_clearance_m: 0.10
    preferred_unknown_clearance_m: 0.25
    frontier_goal_score_obstacle_weight: 3.0
    frontier_goal_score_distance_weight: 1.0
    frontier_goal_score_cluster_weight: 1.5
    frontier_goal_score_unknown_weight: 1.0
    min_free_space_around_goal_m: 0.45
    avoid_corner_goals: true
    corner_penalty: 5.0
    corner_check_radius_m: 0.5
    publish_debug_markers: true
    blacklist_failed_goal_radius_m: 0.75
    blacklist_failed_cluster: true
    min_clearance_after_failure_m: 0.55
    failure_retry_delay_sec: 1.0
    stuck_blocked_cancel_sec: 2.5
    min_reachable_cells_for_bfs: 500
    retreat_from_frontier_steps: 3
    blacklist_radius: 0.55
    blacklist_timeout_sec: 120.0
    distance_weight: 1.0
    size_weight: 0.03
    publish_markers: true
    start_delay_sec: 5.0
    nav2_ready_timeout_sec: 120.0
    nav2_action_wait_sec: 2.0
    nav2_debug_log_interval_sec: 2.0
    wait_for_nav2: true
    require_nav_lifecycle_active: true
    require_cmd_vel_subscriber: true
    require_map_publisher_for_ready: false
    wait_log_interval_sec: 12.0
    integrated_initial_spin: true
    initial_spin_min_duration_sec: 1.5
    initial_spin_max_duration_sec: 40.0
    initial_spin_angular_z: 0.28
    initial_spin_target_rad: 6.28
    map_settle_after_spin_sec: 0.5
    explore_immediately_after_spin: true
    bfs_bridge_known_free_radius_m: 2.5
    nearest_seed_search_radius_m: 0.6
    bfs_seed_search_radius_m: 3.0
    bfs_seed_search_step_m: 0.25
    allow_robot_seed_clearing: true
    robot_seed_clear_radius_m: 0.35
    retry_when_no_frontier: true
    no_frontier_retry_delay_sec: 2.0
    max_no_frontier_retries: 0
    enable_staging_goal: false
    consecutive_fail_limit: 3
    recovery_pause_sec: 2.0
    max_rescan_cycles: 8
    fallback_radius_min_m: 0.15
    fallback_radius_max_m: 0.8
    # Explored-area memory and completion
    explored_mark_radius_m: 0.45
    min_passage_clearance_m: 0.35
    min_passage_clearance_floor_m: 0.28
    narrow_passage_penalty_weight: 4.0
    explored_revisit_penalty: 2.5
    enable_return_home_on_complete: true
    max_unknown_fraction_complete: 0.08
    min_frontier_clusters_to_continue: 1
    enable_active_backout_on_failure: true
    backout_duration_sec: 1.2
    backout_speed_mps: 0.10
    home_goal_tolerance_m: 0.35
    # Goal commitment — avoid rapid re-pick / Nav2 instant-success loops
    min_pause_after_success_sec: 2.5
    min_nav_commit_sec: 4.0
    min_time_between_goal_picks_sec: 3.0
    min_travel_after_goal_m: 0.4
    max_clusters_to_score: 25
