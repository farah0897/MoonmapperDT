diff_drive_controller:
  ros__parameters:
    type: diff_drive_controller/DiffDriveController
    use_sim_time: true

    # TF: odom -> base_footprint (her). URDF: base_footprint -> base_link med z ~0,124 m (hjulplan).

    left_wheel_names:  ["wheel_l1_joint", "wheel_l2_joint", "wheel_l3_joint"]
    right_wheel_names: ["wheel_r1_joint", "wheel_r2_joint", "wheel_r3_joint"]

    # wheel_separation = |Y_wheel_l1 − Y_wheel_r1| i base_link ved nøytral rocker (0).
    # Hjulradius 0,045 m (sylinder i URDF / målt).
    wheel_separation: 0.210729
    wheel_radius:     0.045
    # Ved lineær fart v_lin (m/s) forventes omtrent |omega| ≈ |v_lin|/wheel_radius på hjul-ledd
    # (f.eks. 0.08/0.045 ≈ 1.78 rad/s; slip og begrensninger kan avvike).
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier:  1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_footprint
    enable_odom_tf: true

    cmd_vel_timeout: 0.5
    # Jazzy diff_drive_controller eksponerer ikke ``open_loop`` her; eventuell
    # open-loop-test styres via controller_manager / hardware, ikke denne YAML-en.

    publish_limited_velocity: true
    # NB: Jazzy (ros2_controllers v4.x) sin diff_drive_controller har fjernet
    # parameteret ``use_stamped_vel`` og abonnerer alltid paa TwistStamped paa
    # /diff_drive_controller/cmd_vel. Adapter-noden cmd_vel_odom_relay i
    # moonmapper_bringup konverterer Twist (rover-konvensjon paa /cmd_vel) til
    # TwistStamped paa veien inn til controller-en.

    # Velocity-limiter for trygg sim-fart. Akselerasjons-rampene demper rykk i rocker-bogie.
    linear.x.has_velocity_limits:  true
    linear.x.max_velocity:  0.30
    linear.x.min_velocity: -0.30
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: 0.4

    angular.z.has_velocity_limits: true
    angular.z.max_velocity:  1.0
    angular.z.min_velocity: -1.0
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration: 1.5
