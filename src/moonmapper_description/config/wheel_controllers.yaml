# Kun controller_manager her — lastes av gz_ros2_control-plugin i Gazebo.
# Ikke list opp joint_state_broadcaster / diff_drive her: da blir de auto-innlastet
# og spawner feiler med «Controller already loaded» / «Failed to configure».
# Bruk joint_state_broadcaster.yaml og diff_drive_controller.yaml med spawner.

controller_manager:
  ros__parameters:
    update_rate: 200
    use_sim_time: true
