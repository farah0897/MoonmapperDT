# ros2_control-konfigurasjon for MoonMapper i Gazebo Sim 8.
#
# * controller_manager kjøres IN-PROCESS inne i gz_ros2_control-plugin,
#   saa ingen separat ros2 run controller_manager er nødvendig.
# * joint_state_broadcaster publisher /joint_states med alle joints
#   (inkl. passive rockers/bogies).
# * diff_drive_controller tar en standard Twist på /cmd_vel og
#   omsetter til hjulhastigheter for begge sider.
#
# Hvis du vil ha uavhengig kontroll per hjul (6 WD), erstatter du
# diff_drive_controller med 6 separate velocity_controllers/JointGroup.

controller_manager:
  ros__parameters:
    update_rate: 200   # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    use_sim_time: true

    # Alle tre hjul på hver side drives synkront som en "side"
    left_wheel_names:  ["wheel_l1_joint", "wheel_l2_joint", "wheel_l3_joint"]
    right_wheel_names: ["wheel_r1_joint", "wheel_r2_joint", "wheel_r3_joint"]

    # Hjulgeometri — matcher de faktiske mesh-dimensjonene.
    # (Mesh-bounding box: wheel_l1_link ~14.6mm diam -> radius 7.3mm.
    #  Rocker-origin y = +/- 14.8mm -> separasjon ~30mm mellom sidene.)
    wheel_separation: 0.030    # meter
    wheel_radius:     0.0073   # meter
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier:  1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_footprint

    # Ikke publish TF fra diff_drive (vi bruker robot_state_publisher)
    enable_odom_tf: true

    cmd_vel_timeout: 0.5
    publish_limited_velocity: true

    # Eksplisitt: kontrolleren forventer TwistStamped paa
    # /diff_drive_controller/cmd_vel. Slik matcher vi fri-kjoer-kommandoen:
    #   ros2 run teleop_twist_keyboard teleop_twist_keyboard \
    #       --ros-args \
    #       -r /cmd_vel:=/diff_drive_controller/cmd_vel \
    #       -p stamped:=true \
    #       -p frame_id:=base_link
    use_stamped_vel: true

    # Hastigheter tilpasset en 5cm-lang rover (ellers blir den raketoppskyting).
    # Angulaer-grensen er bevisst lav fordi hjulbredden er ~30mm og
    # roveren tipper hvis man ber om mer enn ~0.3 rad/s i skarp sving.
    linear.x.has_velocity_limits:  true
    linear.x.max_velocity:  0.05
    linear.x.min_velocity: -0.05
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: 0.1

    angular.z.has_velocity_limits: true
    angular.z.max_velocity:  0.5
    angular.z.min_velocity: -0.5
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration: 0.1
